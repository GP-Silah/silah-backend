version: '3.9'

services:
    postgres:
        image: postgres:15
        container_name: silah_db
        restart: always
        ports:
            - '5432:5432'
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB_DEV}
        volumes:
            - silah_dev_data:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}',
                ]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s

    app:
        build: .
        container_name: silah_backend
        restart: always
        ports:
            - '3000:3000'
        env_file:
            - .env
        depends_on:
            postgres:
                condition: service_healthy
        command: sh -c "npx prisma migrate deploy && npm run prisma:seed:category && node dist/main.js"
        volumes:
            - ./app
            - /app/node_modules

volumes:
    silah_dev_data:
